<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Vendedor - JEJA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f7; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card-register { width: 100%; max-width: 400px; padding: 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div class="card card-register bg-white">
        <h3 class="text-center mb-4">Registro JEJA</h3>
        <p class="text-muted text-center">Ingresa tu nombre para activar tu cuenta de vendedor.</p>
        
        <form method="POST">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre del Vendedor</label>
                <input type="text" class="form-control" id="nombre" name="nombre" required placeholder="Ej. Juan Pérez">
            </div>
            <button type="submit" class="btn btn-primary w-100">Registrar y Acceder</button>
        </form>
    </div>

</body>
</html>
