<!DOCTYPE html>
<html>
<body>
    <h1>Panel de Control</h1>
    <button onclick="generar()">Generar Link de Vendedor</button>
    <br><br>
    <input type="text" id="linkGenerado" style="width: 400px;" readonly>
    <script>
    function generar() {
        fetch('/generar_link', { method: 'POST' })
        .then(r => r.json())
        .then(d => document.getElementById('linkGenerado').value = d.link);
    }
    </script>
</body>
</html>
