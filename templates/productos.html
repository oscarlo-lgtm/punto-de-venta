<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Inventario</h1>
    
    <div class="card p-3 border-primary">
        <h5>Generar Enlace de Vendedor</h5>
        <button onclick="generar()">Generar Link</button>
        <div class="mt-2">
            <input type="text" id="linkGenerado" readonly>
            <button onclick="copiar()">Copiar Link</button>
        </div>
    </div>

    <script>
    function generar() {
        fetch('/generar_link', { method: 'POST' })
        .then(r => r.json())
        .then(d => document.getElementById('linkGenerado').value = d.link);
    }
    function copiar() {
        let copyText = document.getElementById("linkGenerado");
        copyText.select();
        document.execCommand("copy");
        alert("Link copiado");
    }
    </script>
</body>
</html>
